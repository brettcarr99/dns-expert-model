[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-expert"
version = "1.0.0"
description = "Local AI Assistant and Knowledge Guidance System for DNS Engineers & Developers"
readme = "README.md"
authors = [{ name = "DNS Experts Community" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "rich>=12.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
dns-expert = "dns_expert.cli:main"
dns-expert-builder = "dns_expert.knowledge.build_index:build_knowledge_base"

[tool.setuptools.packages.find]
include = ["dns_expert*"]
